<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bounty Poster</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!--
          ╔═══════════════════════════════════════════════════════════╗
          ║  WELCOME! This is your bounty poster.                      ║
          ║  Edit the bits marked with  <!-- 👈 ... -->  below.        ║
          ║  Then save, commit, and push. Have fun!                   ║
          ╚═══════════════════════════════════════════════════════════╝
        -->
        <div id="poster-wrapper">
            <div class="bounty-poster">
                <div class="header-section">
                    <div class="header-text">WANTED</div>
                    <!-- 👈 Big word at the top. Try GOATED, LEGEND, etc. -->
                </div>

                <div class="image-section">
                    <div class="image-border">
                        <!-- 👇 Swap profile.png with your own photo
                             (keep the file name profile.png, OR change
                             the src below to your new file name) -->
                        <img src="profile.png" alt="Profile" />
                    </div>
                </div>

                <div class="banner-section">
                    <span class="decoration-left">~</span>
                    <span class="banner-text">DEAD OR ALIVE</span>
                    <!-- 👆 The little tagline. Change it to anything. -->
                    <span class="decoration-right">~</span>
                </div>

                <div class="name-section">
                    <div class="name-text">YOUR NAME</div>
                    <!-- 👆 Put your name here -->
                </div>

                <div class="footer-section">
                    <div class="bounty-row">
                        <span class="currency-symbol">฿</span>
                        <span class="bounty-amount">1,000,000,000-</span>
                        <!-- 👆 Your bounty. Make it ridiculous. -->
                    </div>
                    <img
                        src="sutd-logo.png"
                        alt="SUTD"
                        class="sutd-logo"
                    />
                </div>
            </div>
        </div>
    </body>
</html>
